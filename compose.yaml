services:
  unhost:
    build:
      context: .
    ports:
      - "127.0.0.1:${UNHOST_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      UnHost__BootstrapSecretFile: /run/secrets/bootstrap
    volumes:
      - unhost-data:/data
    secrets:
      - bootstrap

volumes:
  unhost-data:

secrets:
  bootstrap:
    file: ./.secrets/bootstrap.txt
